org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Kotlin's incremental cache cannot relativize Windows paths across drives.
# The project is on D: while Flutter's Pub cache is on C:.
kotlin.incremental=false
